bundle:
  name: stock-market-hybrid

variables:
  catalog:
    description: Existing Unity Catalog catalog for this isolated slice
  schema_prefix:
    description: Existing schema prefix with _bronze, _silver, and _gold schemas
    default: stocks
  bucket:
    description: Existing S3 bucket with governed landing/lakehouse/checkpoint access
  maintenance_cron:
    description: Quartz cron expression for scheduled OPTIMIZE+VACUUM (default 03:00 UTC daily, off-peak for a personal single-user account)
    default: "0 0 3 * * ?"
  maintenance_schedule_status:
    description: >-
      PAUSED (default) or UNPAUSED. Ships PAUSED deliberately: a plain
      `bundle deploy` must never silently start a live recurring cron job -
      the Databricks Terraform provider docs confirm pause_status defaults
      to UNPAUSED if omitted, so this is set explicitly, not left implicit.
      Flip to UNPAUSED only as its own deliberate action once you want
      scheduled maintenance actually running.
    default: "PAUSED"

# No `run_as`: the job runs as whoever deploys it (the current default when
# `run_as` is omitted). Setting `run_as: service_principal_name` to the
# least-privilege runtime principal would need that principal's "Service
# Principal User" role granted to the deploying identity - a permission this
# provider version exposes only through account-level rule-set resources
# (databricks_access_control_rule_set with an `accounts/<id>/...` path), and
# it's unverified whether that account-level API path works from a
# workspace-scoped provider/token on Free Edition. Rather than guess at that
# again, this personal single-admin slice runs the job as the deploying admin
# directly. The `runtime` service principal and its Unity Catalog grants in
# workspace/main.tf still exist and stay least-privilege-ready for later.

artifacts:
  hybrid_wheel:
    type: whl
    path: .
    build: python -m pip wheel --no-deps --wheel-dir dist .

resources:
  jobs:
    landed_ticks:
      name: stock-market-hybrid-${bundle.target}-landed-ticks
      description: Manual AvailableNow ingestion and bounded sampled-quote snapshots (serverless compute)
      max_concurrent_runs: 1
      timeout_seconds: 1800
      queue:
        enabled: false
      tasks:
        - task_key: ingest_and_rebuild_quotes
          environment_key: ticks_env
          timeout_seconds: 1800
          max_retries: 0
          retry_on_timeout: false
          python_wheel_task:
            package_name: stock_market_hybrid
            entry_point: landed_ticks
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema-prefix
              - ${var.schema_prefix}
              - --bucket
              - ${var.bucket}
      # Serverless jobs install dependencies through a job-level environment,
      # not the classic-cluster `libraries:` task stanza. environment_version
      # "4" is used deliberately: "2" has a documented wheel-loading bug.
      # Unverified against a live workspace — run `databricks bundle validate
      # -t dev` before deploying and adjust if the current CLI schema differs.
      environments:
        - environment_key: ticks_env
          spec:
            environment_version: "4"
            dependencies:
              - ./dist/*.whl

    landed_fundamentals:
      name: stock-market-hybrid-${bundle.target}-landed-fundamentals
      description: Manual direct-fetch (yfinance) and latest-per-symbol fundamentals snapshot (serverless compute, R6)
      max_concurrent_runs: 1
      # Longer than landed_ticks: fetching 10 symbols with retry/backoff and
      # inter-symbol spacing can take a few minutes even when yfinance is
      # healthy, and considerably longer if several symbols need retries.
      timeout_seconds: 2700
      queue:
        enabled: false
      tasks:
        - task_key: fetch_and_rebuild_fundamentals
          environment_key: fundamentals_env
          timeout_seconds: 2700
          max_retries: 0
          retry_on_timeout: false
          python_wheel_task:
            package_name: stock_market_hybrid
            entry_point: landed_fundamentals
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema-prefix
              - ${var.schema_prefix}
              - --bucket
              - ${var.bucket}
      environments:
        - environment_key: fundamentals_env
          spec:
            environment_version: "4"
            # yfinance itself (not just the wheel) - this job calls the
            # external API directly, unlike landed_ticks which only reads
            # already-landed S3 files.
            dependencies:
              - ./dist/*.whl
              - yfinance==0.2.66

    landed_historical:
      name: stock-market-hybrid-${bundle.target}-landed-historical
      description: Manual direct-fetch (yfinance) multi-year OHLCV backfill and latest-per-(symbol,date) snapshot (serverless compute, R6)
      max_concurrent_runs: 1
      # 10 symbols x up to 5 years of daily bars, with retry/backoff and
      # inter-symbol spacing, can take a while even when yfinance is healthy.
      timeout_seconds: 2700
      queue:
        enabled: false
      tasks:
        - task_key: fetch_and_rebuild_historical
          environment_key: historical_env
          timeout_seconds: 2700
          max_retries: 0
          retry_on_timeout: false
          python_wheel_task:
            package_name: stock_market_hybrid
            entry_point: landed_historical
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema-prefix
              - ${var.schema_prefix}
              - --bucket
              - ${var.bucket}
      environments:
        - environment_key: historical_env
          spec:
            environment_version: "4"
            dependencies:
              - ./dist/*.whl
              - yfinance==0.2.66
              # landed_historical.py reuses historical_backfill.py::download_history,
              # and importing that module also executes its top-level
              # `from src.config.settings import get_settings` (used by that
              # module's own legacy Spark-session/CLI code, not by
              # download_history itself) - confirmed live 2026-09-27:
              # ModuleNotFoundError without this.
              - pydantic-settings==2.2.1

    landed_indicators:
      name: stock-market-hybrid-${bundle.target}-landed-indicators
      description: Full-rebuild indicators/signals/sector-performance/correlations from landed_historical's gold table (serverless compute, R6)
      max_concurrent_runs: 1
      timeout_seconds: 1800
      queue:
        enabled: false
      tasks:
        - task_key: rebuild_indicators
          environment_key: indicators_env
          timeout_seconds: 1800
          max_retries: 0
          retry_on_timeout: false
          python_wheel_task:
            package_name: stock_market_hybrid
            entry_point: landed_indicators
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema-prefix
              - ${var.schema_prefix}
              - --bucket
              - ${var.bucket}
      environments:
        - environment_key: indicators_env
          spec:
            environment_version: "4"
            # No external API calls (reads an already-published Databricks
            # table) - only the wheel is needed, no yfinance.
            dependencies:
              - ./dist/*.whl
              # databricks_indicators.py reuses daily_aggregation.py's
              # transform functions, and importing that module also executes
              # its top-level `from src.config.settings import get_settings` -
              # same gap as historical_env, fixed the same way.
              - pydantic-settings==2.2.1

    maintain_delta_tables:
      name: stock-market-hybrid-${bundle.target}-maintain-delta-tables
      description: >-
        Scheduled OPTIMIZE + VACUUM (RETAIN 168 HOURS, Delta's own safety
        floor - never bypassed) across every table this migration owns.
        The one job in this bundle that runs on a real schedule rather than
        being manually triggered - see databricks_maintenance.py's module
        docstring for why that's a deliberate exception, not an
        inconsistency, and why the schedule ships PAUSED by default.
      max_concurrent_runs: 1
      timeout_seconds: 1800
      queue:
        enabled: false
      # PAUSED by default (see the maintenance_schedule_status variable) -
      # `bundle deploy` creates this schedule's definition but never
      # silently starts it firing; unpausing is a separate, explicit action.
      schedule:
        quartz_cron_expression: ${var.maintenance_cron}
        timezone_id: "UTC"
        pause_status: ${var.maintenance_schedule_status}
      tasks:
        - task_key: optimize_and_vacuum
          environment_key: maintenance_env
          timeout_seconds: 1800
          max_retries: 0
          retry_on_timeout: false
          python_wheel_task:
            package_name: stock_market_hybrid
            entry_point: maintain_delta_tables
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema-prefix
              - ${var.schema_prefix}
      environments:
        - environment_key: maintenance_env
          spec:
            environment_version: "4"
            # OPTIMIZE/VACUUM only - no external API calls, no yfinance.
            dependencies:
              - ./dist/*.whl
              # databricks_maintenance.py imports databricks_historical and
              # databricks_indicators to build its table registry, which
              # transitively import src.config.settings the same way
              # historical_env/indicators_env do - same fix.
              - pydantic-settings==2.2.1

targets:
  dev:
    default: true
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}