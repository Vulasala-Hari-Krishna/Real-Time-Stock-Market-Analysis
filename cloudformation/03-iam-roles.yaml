AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  IAM resources for the stock market analytics pipeline.
  Creates a pipeline IAM user with least-privilege access to the S3 data
  lake (used by the local Kafka producer/consumer path). Stores
  credentials in Secrets Manager.

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    Default: dev
    Description: Deployment environment
  ProjectName:
    Type: String
    Default: stock-market-pipeline
    Description: Project name used in resource naming

Resources:
  PipelineUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub '${ProjectName}-pipeline-${Environment}'
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  PipelineAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref PipelineUser

  PipelinePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub '${ProjectName}-pipeline-policy-${Environment}'
      Description: Least-privilege policy for pipeline S3 access
      Users:
        - !Ref PipelineUser
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: S3DataLakeReadWrite
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !ImportValue
                  Fn::Sub: '${ProjectName}-${Environment}-DataLakeBucketArn'
              - !Sub
                - '${BucketArn}/*'
                - BucketArn: !ImportValue
                    Fn::Sub: '${ProjectName}-${Environment}-DataLakeBucketArn'

  # ------------------------------------------------------------------
  # Secrets Manager (optional — uncomment to store credentials in AWS
  # instead of the local .env file. Costs ~$0.40/month per secret.)
  # ------------------------------------------------------------------
  # PipelineCredentialsSecret:
  #   Type: AWS::SecretsManager::Secret
  #   Properties:
  #     Name: !Sub '${ProjectName}/${Environment}/pipeline-credentials'
  #     Description: !Sub 'Pipeline IAM user credentials for ${Environment}'
  #     SecretString: !Sub |
  #       {
  #         "AccessKeyId": "${PipelineAccessKey}",
  #         "SecretAccessKey": "${PipelineAccessKey.SecretAccessKey}"
  #       }
  #     Tags:
  #       - Key: Project
  #         Value: !Ref ProjectName
  #       - Key: Environment
  #         Value: !Ref Environment

Outputs:
  PipelineUserArn:
    Description: ARN of the pipeline IAM user
    Value: !GetAtt PipelineUser.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-PipelineUserArn'
  PipelineAccessKeyId:
    Description: Access key ID for the pipeline IAM user (put this in .env as AWS_ACCESS_KEY_ID)
    Value: !Ref PipelineAccessKey
  PipelineSecretAccessKey:
    Description: Secret access key for the pipeline IAM user (put this in .env as AWS_SECRET_ACCESS_KEY)
    Value: !GetAtt PipelineAccessKey.SecretAccessKey
  # ------------------------------------------------------------------
  # Uncomment if you re-enable PipelineCredentialsSecret above
  # ------------------------------------------------------------------
  # PipelineCredentialsSecretArn:
  #   Description: ARN of the Secrets Manager secret holding pipeline credentials
  #   Value: !Ref PipelineCredentialsSecret
  #   Export:
  #     Name: !Sub '${ProjectName}-${Environment}-PipelineCredentialsSecretArn'
