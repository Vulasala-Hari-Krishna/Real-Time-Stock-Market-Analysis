AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  S3 data lake buckets for the stock market analytics pipeline.
  Preserves legacy bronze/silver/gold paths and defines separate hybrid
  landing, lakehouse, checkpoint, and publishing paths. Includes an
  Athena query results bucket for the existing local workflow.

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    Default: dev
    Description: Deployment environment
  ProjectName:
    Type: String
    Default: stock-market-pipeline
    Description: Project name used in resource naming

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  DataLakeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BucketName: !Sub '${ProjectName}-datalake-${Environment}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: BronzeExpiration
            Prefix: bronze/
            Status: Enabled
            ExpirationInDays: 30
          - Id: AbortIncompleteLandingUploads
            Prefix: landing/
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: AbortIncompletePublishUploads
            Prefix: publish/
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  DataLakeBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataLakeBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DataLakeBucket.Arn
              - !Sub '${DataLakeBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  AthenaResultsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BucketName: !Sub '${ProjectName}-athena-results-${Environment}-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireQueryResults
            Status: Enabled
            ExpirationInDays: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

Outputs:
  DataLakeBucketName:
    Description: Name of the S3 data lake bucket
    Value: !Ref DataLakeBucket
    Export:
      Name: !Sub '${ProjectName}-${Environment}-DataLakeBucketName'
  DataLakeBucketArn:
    Description: ARN of the S3 data lake bucket
    Value: !GetAtt DataLakeBucket.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-DataLakeBucketArn'
  HybridLandingUri:
    Description: Raw source files, separate from legacy bronze and Delta tables
    Value: !Sub 's3://${DataLakeBucket}/landing/'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-HybridLandingUri'
  HybridLakehouseUri:
    Description: Unity Catalog external Delta table storage; no lifecycle expiry
    Value: !Sub 's3://${DataLakeBucket}/lakehouse/'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-HybridLakehouseUri'
  HybridCheckpointUri:
    Description: Hybrid checkpoints and schema state; no lifecycle expiry
    Value: !Sub 's3://${DataLakeBucket}/checkpoints/hybrid/'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-HybridCheckpointUri'
  HybridPublishUri:
    Description: Immutable snapshots and completed manifests for Snowflake
    Value: !Sub 's3://${DataLakeBucket}/publish/'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-HybridPublishUri'
  AthenaResultsBucketName:
    Description: Name of the Athena query results bucket
    Value: !Ref AthenaResultsBucket
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AthenaResultsBucketName'
  AthenaResultsBucketArn:
    Description: ARN of the Athena query results bucket
    Value: !GetAtt AthenaResultsBucket.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AthenaResultsBucketArn'
