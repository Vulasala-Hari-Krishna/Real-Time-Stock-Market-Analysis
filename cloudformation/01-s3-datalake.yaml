AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  S3 data lake bucket for the stock market analytics pipeline. Defines the
  hybrid landing, lakehouse, checkpoint, and publishing paths that the
  Kafka producer/consumer, Databricks jobs, and Snowflake loader use.

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - prod
    Default: dev
    Description: Deployment environment
  ProjectName:
    Type: String
    Default: stock-market-pipeline
    Description: Project name used in resource naming

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Resources:
  DataLakeBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BucketName: !Sub '${ProjectName}-datalake-${Environment}-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteLandingUploads
            Prefix: landing/
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: AbortIncompletePublishUploads
            Prefix: publish/
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: PublishBatchExpiration
            Prefix: publish/
            Status: Enabled
            # Every gold_snapshot.py export run (ticks every 15 min, daily/
            # weekly jobs) writes a new immutable batch here and never
            # deletes an old one - Snowflake's COPY INTO only ever reads the
            # single batch named in its own manifest, never the whole
            # prefix, so nothing downstream depends on a batch surviving
            # past the run that consumed it. 30 days (matching legacy
            # bronze/'s own retention below) leaves ample room to retry a
            # failed Snowflake load from the original export before it goes.
            ExpirationInDays: 30
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  DataLakeBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataLakeBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DataLakeBucket.Arn
              - !Sub '${DataLakeBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  DataLakeBucketName:
    Description: Name of the S3 data lake bucket
    Value: !Ref DataLakeBucket
    Export:
      Name: !Sub '${ProjectName}-${Environment}-DataLakeBucketName'
  DataLakeBucketArn:
    Description: ARN of the S3 data lake bucket
    Value: !GetAtt DataLakeBucket.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-DataLakeBucketArn'
  HybridLandingUri:
    Description: Raw source files, separate from legacy bronze and Delta tables
    Value: !Sub 's3://${DataLakeBucket}/landing/'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-HybridLandingUri'
  HybridLakehouseUri:
    Description: Unity Catalog external Delta table storage; no lifecycle expiry
    Value: !Sub 's3://${DataLakeBucket}/lakehouse/'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-HybridLakehouseUri'
  HybridCheckpointUri:
    Description: Hybrid checkpoints and schema state; no lifecycle expiry
    Value: !Sub 's3://${DataLakeBucket}/checkpoints/hybrid/'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-HybridCheckpointUri'
  HybridPublishUri:
    Description: Immutable snapshots and completed manifests for Snowflake
    Value: !Sub 's3://${DataLakeBucket}/publish/'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-HybridPublishUri'
