name: Fetch Fundamentals

# R6 (first migrated legacy product): fetches yfinance fundamentals for the
# watchlist and lands one immutable, content-addressed NDJSON batch to S3
# landing/fundamentals/ for src/batch/databricks_fundamentals.py to ingest.
# Unlike the continuously-polling local producer, this is manual/periodic -
# fundamentals change slowly, so there is no reason to run it continuously.
# No Databricks CLI/Terraform needed here, only AWS credentials, same as
# export-gold-snapshot.yaml.
#
# Prerequisites: stack 01 (S3 datalake) already deployed. Needs repo secret
# AWS_DEPLOY_ROLE_ARN (already used by the other AWS workflows).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      aws-region:
        description: 'AWS region (must match the Databricks platform deploy)'
        required: true
        default: 'us-east-2'
        type: string
      symbols:
        description: 'Comma-separated symbol override (leave blank for the full watchlist)'
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  fetch:
    name: Fetch and Land Fundamentals
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Read project data-lake bucket name (requires stack 01 already deployed)
        id: databucket
        run: |
          NAME=$(aws cloudformation list-exports --region "${{ inputs.aws-region }}" \
            --query "Exports[?Name=='stock-market-pipeline-${{ inputs.environment }}-DataLakeBucketName'].Value" \
            --output text)
          if [ -z "${NAME}" ]; then
            echo "ERROR: stack 01 (S3 datalake) export not found in ${{ inputs.aws-region }}." >&2
            exit 1
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Run fundamentals fetcher
        env:
          BUCKET: ${{ steps.databucket.outputs.name }}
          SYMBOLS: ${{ inputs.symbols }}
        run: |
          ARGS=(--bucket "${BUCKET}")
          if [ -n "${SYMBOLS}" ]; then
            ARGS+=(--symbols "${SYMBOLS}")
          fi
          python -m src.producers.fundamentals_fetcher "${ARGS[@]}"
