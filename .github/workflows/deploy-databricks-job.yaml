name: Deploy Databricks Job

# Validates and deploys the landed_ticks wheel-task bundle
# (databricks/databricks.yml) - infra only. This workflow does NOT trigger a
# run or upload a fixture: GitHub Actions owns infra deploy/update/teardown
# in this project, never job execution or triggering it. Per the target
# architecture (docs/hybrid-migration.md), local Airflow is meant to trigger
# Databricks job runs via the Databricks Job API (R8, not yet built) - until
# then, trigger a run manually from the Databricks workspace UI (Workflows ->
# stock-market-hybrid-<target>-landed-ticks -> Run now) or via
# `databricks bundle run -t dev landed_ticks` from a machine with the
# Databricks CLI configured. Reads catalog/bucket/service-principal values
# directly from the workspace Terraform root's remote state (no manual
# copying) via deploy-databricks-platform.yaml's backend.
#
# Prerequisites: deploy-databricks-platform.yaml has already run successfully
# in the same environment/region. Needs repo secrets DATABRICKS_HOST and
# DATABRICKS_TOKEN (already added for that workflow) and AWS_DEPLOY_ROLE_ARN.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      aws-region:
        description: 'AWS region (must match the platform deploy)'
        required: true
        default: 'us-east-2'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  read-platform-state:
    name: Read Bundle Variables From Terraform State
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      catalog: ${{ steps.vars.outputs.catalog }}
      schema_prefix: ${{ steps.vars.outputs.schema_prefix }}
      bucket: ${{ steps.vars.outputs.bucket }}
      run_as_service_principal: ${{ steps.vars.outputs.run_as_service_principal }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Read Terraform state backend outputs (stack 00 must already exist)
        id: state
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "stock-market-pipeline-00-terraform-state-${{ inputs.environment }}" \
            --region "${{ inputs.aws-region }}" \
            --query "Stacks[0].Outputs[?OutputKey=='TerraformStateBucketName'].OutputValue" --output text)
          TABLE=$(aws cloudformation describe-stacks \
            --stack-name "stock-market-pipeline-00-terraform-state-${{ inputs.environment }}" \
            --region "${{ inputs.aws-region }}" \
            --query "Stacks[0].Outputs[?OutputKey=='TerraformLockTableName'].OutputValue" --output text)
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "table=${TABLE}" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform init (remote state, read-only)
        working-directory: databricks/terraform/workspace
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ steps.state.outputs.bucket }}" \
            -backend-config="region=${{ inputs.aws-region }}" \
            -backend-config="dynamodb_table=${{ steps.state.outputs.table }}"

      - name: Read bundle_variables output
        id: vars
        working-directory: databricks/terraform/workspace
        run: |
          terraform output -json bundle_variables > /tmp/bundle_vars.json
          echo "catalog=$(jq -r .catalog /tmp/bundle_vars.json)" >> "$GITHUB_OUTPUT"
          echo "schema_prefix=$(jq -r .schema_prefix /tmp/bundle_vars.json)" >> "$GITHUB_OUTPUT"
          echo "bucket=$(jq -r .bucket /tmp/bundle_vars.json)" >> "$GITHUB_OUTPUT"
          echo "run_as_service_principal=$(jq -r .run_as_service_principal /tmp/bundle_vars.json)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Bundle Validate and Deploy (infra only, no run)
    runs-on: ubuntu-latest
    needs: read-platform-state
    environment: ${{ inputs.environment }}
    env:
      BUNDLE_VAR_catalog: ${{ needs.read-platform-state.outputs.catalog }}
      BUNDLE_VAR_schema_prefix: ${{ needs.read-platform-state.outputs.schema_prefix }}
      BUNDLE_VAR_bucket: ${{ needs.read-platform-state.outputs.bucket }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - uses: databricks/setup-cli@main

      - name: databricks bundle validate
        working-directory: databricks
        run: databricks bundle validate -t dev

      - name: databricks bundle deploy
        working-directory: databricks
        run: databricks bundle deploy -t dev

      - name: Next step (manual)
        run: |
          echo "Deployed. This workflow does not trigger a run or upload a" \
               "fixture - GitHub Actions owns infra deploy/update/teardown" \
               "only. Trigger the job manually from the Databricks workspace" \
               "UI (Workflows -> stock-market-hybrid-${{ inputs.environment }}" \
               "-landed-ticks -> Run now), or via 'databricks bundle run -t dev" \
               "landed_ticks' from a machine with the Databricks CLI configured."
