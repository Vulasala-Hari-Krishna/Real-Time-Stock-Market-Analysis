name: Deploy Snowflake Platform

# Automates the Snowflake platform bootstrap across two Terraform roots
# (mirrors the Databricks credential/workspace split, for the same reason):
# CloudFormation stack 07 (deny-all IAM role) -> apply the `bootstrap` root
# (storage integration only - nothing gated, always safe to apply) -> read
# its generated IAM user ARN/external ID -> re-deploy stack 07 with real
# trust -> apply the `workspace` root (warehouse/database/schema/role/
# grants/stage; applied exactly once, only now that trust is real).
#
# This two-root split exists because a Terraform lifecycle.precondition
# failure blocks an ENTIRE plan/apply, not just the gated resource -
# confirmed live 2026-09-25 after an earlier single-root design tried to
# gate only the stage and found nothing got created at all. Same remote-
# state S3 backend as the Databricks roots (stack 00), same job-output-
# passing pattern - no manual value copying between steps.
#
# Prerequisites: stacks 00 and 01 already deployed. Needs repo secrets
# AWS_DEPLOY_ROLE_ARN (existing), SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER,
# SNOWFLAKE_PRIVATE_KEY.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      aws-region:
        description: 'AWS region (must match the Databricks platform deploy)'
        required: true
        default: 'us-east-2'
        type: string
      database_name:
        description: 'Snowflake database name'
        required: true
        default: 'STOCK_MARKET_DEV'
        type: string
      schema_name:
        description: 'Snowflake staging schema name'
        required: true
        default: 'PUBLISH_STAGING'
        type: string
      serving_schema_name:
        description: 'Snowflake serving schema name (R4 loader publish target)'
        required: true
        default: 'SERVING'
        type: string
      warehouse_name:
        description: 'Snowflake warehouse name'
        required: true
        default: 'STOCK_MARKET_DEV_WH'
        type: string
      loader_role_name:
        description: 'Least-privilege Snowflake role for routine loads'
        required: true
        default: 'STOCK_MARKET_DEV_LOADER'
        type: string
      integration_name:
        description: 'Snowflake storage integration name'
        required: true
        default: 'STOCK_MARKET_DEV_PUBLISH_INTEGRATION'
        type: string
      credit_quota:
        description: 'Resource monitor credit quota (max 25)'
        required: true
        default: '10'
        type: string

permissions:
  id-token: write
  contents: read

env:
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}

jobs:
  bootstrap:
    name: Bootstrap State Backend + IAM Role (00, 07)
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      state_bucket: ${{ steps.state.outputs.bucket }}
      lock_table: ${{ steps.state.outputs.table }}
      storage_role_arn: ${{ steps.role.outputs.arn }}
      data_bucket: ${{ steps.databucket.outputs.name }}
      organization_name: ${{ steps.snowflake_account.outputs.organization_name }}
      account_name: ${{ steps.snowflake_account.outputs.account_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Split SNOWFLAKE_ACCOUNT into organization_name/account_name
        id: snowflake_account
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: |
          # Provider 2.x does not read SNOWFLAKE_ACCOUNT (confirmed live: it
          # warns "environment variable is ignored" and requires an opt-in
          # experiment); organization_name/account_name must be passed
          # explicitly instead. These aren't secrets - just split from the
          # existing SNOWFLAKE_ACCOUNT secret so no new secret is needed.
          ORG="${SNOWFLAKE_ACCOUNT%%-*}"
          ACCT="${SNOWFLAKE_ACCOUNT#*-}"
          echo "organization_name=${ORG}" >> "$GITHUB_OUTPUT"
          echo "account_name=${ACCT}" >> "$GITHUB_OUTPUT"

      - name: Deploy Terraform state backend (stack 00, idempotent)
        run: |
          aws cloudformation deploy \
            --stack-name "stock-market-pipeline-00-terraform-state-${{ inputs.environment }}" \
            --template-file cloudformation/00-terraform-state.yaml \
            --parameter-overrides "Environment=${{ inputs.environment }}" "ProjectName=stock-market-pipeline" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "${{ inputs.aws-region }}" \
            --no-fail-on-empty-changeset

      - name: Read state backend outputs
        id: state
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "stock-market-pipeline-00-terraform-state-${{ inputs.environment }}" \
            --region "${{ inputs.aws-region }}" \
            --query "Stacks[0].Outputs[?OutputKey=='TerraformStateBucketName'].OutputValue" --output text)
          TABLE=$(aws cloudformation describe-stacks \
            --stack-name "stock-market-pipeline-00-terraform-state-${{ inputs.environment }}" \
            --region "${{ inputs.aws-region }}" \
            --query "Stacks[0].Outputs[?OutputKey=='TerraformLockTableName'].OutputValue" --output text)
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "table=${TABLE}" >> "$GITHUB_OUTPUT"

      - name: Deploy Snowflake storage-role stack (07), trust disabled
        run: |
          aws cloudformation deploy \
            --stack-name "stock-market-pipeline-07-snowflake-storage-role-${{ inputs.environment }}" \
            --template-file cloudformation/07-snowflake-storage-role.yaml \
            --parameter-overrides \
              "Environment=${{ inputs.environment }}" \
              "ProjectName=stock-market-pipeline" \
              "EnableSnowflakeTrust=false" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "${{ inputs.aws-region }}" \
            --no-fail-on-empty-changeset

      - name: Read storage role ARN
        id: role
        run: |
          ARN=$(aws cloudformation describe-stacks \
            --stack-name "stock-market-pipeline-07-snowflake-storage-role-${{ inputs.environment }}" \
            --region "${{ inputs.aws-region }}" \
            --query "Stacks[0].Outputs[?OutputKey=='SnowflakeStorageRoleArn'].OutputValue" --output text)
          echo "arn=${ARN}" >> "$GITHUB_OUTPUT"

      - name: Read project data-lake bucket name (requires stack 01 already deployed)
        id: databucket
        run: |
          NAME=$(aws cloudformation list-exports --region "${{ inputs.aws-region }}" \
            --query "Exports[?Name=='stock-market-pipeline-${{ inputs.environment }}-DataLakeBucketName'].Value" \
            --output text)
          if [ -z "${NAME}" ]; then
            echo "ERROR: stack 01 (S3 datalake) export not found in ${{ inputs.aws-region }}." >&2
            exit 1
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

  snowflake-bootstrap:
    name: 'Terraform: bootstrap root (storage integration)'
    runs-on: ubuntu-latest
    needs: bootstrap
    environment: ${{ inputs.environment }}
    outputs:
      iam_principal_arn: ${{ steps.outputs.outputs.iam_principal_arn }}
      external_id: ${{ steps.outputs.outputs.external_id }}
      integration_name: ${{ steps.outputs.outputs.integration_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform init (remote state)
        working-directory: snowflake/terraform/bootstrap
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ needs.bootstrap.outputs.state_bucket }}" \
            -backend-config="region=${{ inputs.aws-region }}" \
            -backend-config="dynamodb_table=${{ needs.bootstrap.outputs.lock_table }}"

      - name: Terraform apply
        working-directory: snowflake/terraform/bootstrap
        run: |
          terraform apply -input=false -auto-approve \
            -var="bucket=${{ needs.bootstrap.outputs.data_bucket }}" \
            -var="storage_role_arn=${{ needs.bootstrap.outputs.storage_role_arn }}" \
            -var="integration_name=${{ inputs.integration_name }}" \
            -var="organization_name=${{ needs.bootstrap.outputs.organization_name }}" \
            -var="account_name=${{ needs.bootstrap.outputs.account_name }}"

      - name: Capture generated IAM trust values
        id: outputs
        working-directory: snowflake/terraform/bootstrap
        run: |
          echo "iam_principal_arn=$(terraform output -raw iam_principal_arn)" >> "$GITHUB_OUTPUT"
          echo "external_id=$(terraform output -raw external_id)" >> "$GITHUB_OUTPUT"
          echo "integration_name=$(terraform output -raw integration_name)" >> "$GITHUB_OUTPUT"

  activate-trust:
    name: Activate Snowflake IAM Trust (07, second phase)
    runs-on: ubuntu-latest
    needs: [bootstrap, snowflake-bootstrap]
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Re-deploy stack 07 with the real generated trust values
        run: |
          aws cloudformation deploy \
            --stack-name "stock-market-pipeline-07-snowflake-storage-role-${{ inputs.environment }}" \
            --template-file cloudformation/07-snowflake-storage-role.yaml \
            --parameter-overrides \
              "Environment=${{ inputs.environment }}" \
              "ProjectName=stock-market-pipeline" \
              "EnableSnowflakeTrust=true" \
              "SnowflakeIamUserArn=${{ needs.snowflake-bootstrap.outputs.iam_principal_arn }}" \
              "SnowflakeExternalId=${{ needs.snowflake-bootstrap.outputs.external_id }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "${{ inputs.aws-region }}" \
            --no-fail-on-empty-changeset

  snowflake-workspace:
    name: 'Terraform: workspace root (warehouse/db/schema/role/stage)'
    runs-on: ubuntu-latest
    needs: [bootstrap, snowflake-bootstrap, activate-trust]
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform init (remote state)
        working-directory: snowflake/terraform/workspace
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ needs.bootstrap.outputs.state_bucket }}" \
            -backend-config="region=${{ inputs.aws-region }}" \
            -backend-config="dynamodb_table=${{ needs.bootstrap.outputs.lock_table }}"

      - name: Terraform apply (trust_activation_confirmed=true)
        working-directory: snowflake/terraform/workspace
        run: |
          terraform apply -input=false -auto-approve \
            -var="bucket=${{ needs.bootstrap.outputs.data_bucket }}" \
            -var="database_name=${{ inputs.database_name }}" \
            -var="schema_name=${{ inputs.schema_name }}" \
            -var="serving_schema_name=${{ inputs.serving_schema_name }}" \
            -var="warehouse_name=${{ inputs.warehouse_name }}" \
            -var="loader_role_name=${{ inputs.loader_role_name }}" \
            -var="credit_quota=${{ inputs.credit_quota }}" \
            -var="integration_name=${{ needs.snowflake-bootstrap.outputs.integration_name }}" \
            -var="organization_name=${{ needs.bootstrap.outputs.organization_name }}" \
            -var="account_name=${{ needs.bootstrap.outputs.account_name }}" \
            -var="loader_grantee_user=${{ secrets.SNOWFLAKE_USER }}" \
            -var="trust_activation_confirmed=true"

      - name: Print platform outputs
        working-directory: snowflake/terraform/workspace
        run: terraform output -json
