name: Teardown Databricks Platform

# Reverse of deploy-databricks-platform.yaml: drops every owned Unity
# Catalog table, destroys the workspace Terraform root, then the credential
# root, removes the deployed bundle (jobs + wheel artifact), then
# CloudFormation stacks 06 and 05. Requires the SAME
# catalog/schema_prefix/credential_name inputs used at deploy time, because
# Terraform must recompute the same resource addresses to know what to
# destroy.
#
# Deliberately does NOT touch stack 00 (the Terraform state bucket/lock
# table): that resource is what this very pipeline depends on, and it uses
# DeletionPolicy: Retain in the template. Delete it manually (empty the S3
# bucket, delete the bucket, delete the DynamoDB table) only after
# confirming both Terraform roots destroyed cleanly.
#
# The workspace-objects destroy FAILS if the catalog/schemas still contain
# tables (force_destroy=false, by design) - confirmed live 2026-09-27, not
# theoretical, once any job has actually run. The drop-owned-tables job
# below handles this automatically now via `maintain_delta_tables
# --drop-tables` (the same already-deployed job `databricks_maintenance.py`
# schedules for OPTIMIZE/VACUUM) - triggering it here, from GitHub Actions,
# is a deliberate, considered exception to the "GitHub Actions never
# triggers a job run" rule (see the `feedback_github_actions_infra_only`
# project memory): `maintain_delta_tables` is infrastructure housekeeping,
# not business logic - it's already the one job in this bundle allowed a
# native schedule for exactly that reason - and a full teardown is
# unambiguously an infra operation. Dropping the catalog registrations is a
# means to that end, not a business-data run; every other job (ticks,
# fundamentals, historical, indicators) is still never triggered here.
#
# `databricks bundle destroy` (new, near the end) removes the 5 deployed
# job resources and the uploaded wheel artifact - confirmed live 2026-09-27
# that without this, "teardown" left them silently orphaned in the
# workspace after the Terraform-managed platform was gone.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment (only dev allowed)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
      confirmation:
        description: 'Type DESTROY to confirm teardown'
        required: true
        type: string
      aws-region:
        description: 'AWS region (must match the deploy run)'
        required: true
        default: 'us-east-2'
        type: string
      catalog:
        description: 'Same catalog name used at deploy time'
        required: true
        default: 'stock_market_dev'
        type: string
      schema_prefix:
        description: 'Same schema prefix used at deploy time'
        required: true
        default: 'stocks'
        type: string
      credential_name:
        description: 'Same credential name used at deploy time'
        required: true
        default: 'stock_market_dev_ticks'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: Validate Confirmation
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
            echo "ERROR: You must type DESTROY to confirm teardown."
            exit 1
          fi
          if [ "${{ inputs.environment }}" != "dev" ]; then
            echo "ERROR: Teardown via workflow is only allowed for the dev environment."
            exit 1
          fi

  read-state-backend:
    name: Read State Backend + Role ARN
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ inputs.environment }}
    outputs:
      state_bucket: ${{ steps.state.outputs.bucket }}
      lock_table: ${{ steps.state.outputs.table }}
      storage_role_arn: ${{ steps.role.outputs.arn }}
      data_bucket: ${{ steps.databucket.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Read Terraform state backend outputs (stack 00 must already exist)
        id: state
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "stock-market-pipeline-00-terraform-state-${{ inputs.environment }}" \
            --region "${{ inputs.aws-region }}" \
            --query "Stacks[0].Outputs[?OutputKey=='TerraformStateBucketName'].OutputValue" --output text)
          TABLE=$(aws cloudformation describe-stacks \
            --stack-name "stock-market-pipeline-00-terraform-state-${{ inputs.environment }}" \
            --region "${{ inputs.aws-region }}" \
            --query "Stacks[0].Outputs[?OutputKey=='TerraformLockTableName'].OutputValue" --output text)
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "table=${TABLE}" >> "$GITHUB_OUTPUT"

      - name: Read storage role ARN (stack 06 must still exist)
        id: role
        run: |
          ARN=$(aws cloudformation describe-stacks \
            --stack-name "stock-market-pipeline-06-databricks-storage-role-${{ inputs.environment }}" \
            --region "${{ inputs.aws-region }}" \
            --query "Stacks[0].Outputs[?OutputKey=='DatabricksStorageRoleArn'].OutputValue" --output text)
          echo "arn=${ARN}" >> "$GITHUB_OUTPUT"

      - name: Read project data-lake bucket name
        id: databucket
        run: |
          NAME=$(aws cloudformation list-exports --region "${{ inputs.aws-region }}" \
            --query "Exports[?Name=='stock-market-pipeline-${{ inputs.environment }}-DataLakeBucketName'].Value" \
            --output text)
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

  drop-owned-tables:
    name: Drop Unity Catalog tables (via maintain_delta_tables --drop-tables)
    runs-on: ubuntu-latest
    needs: read-state-backend
    environment: ${{ inputs.environment }}
    env:
      BUNDLE_VAR_catalog: ${{ inputs.catalog }}
      BUNDLE_VAR_schema_prefix: ${{ inputs.schema_prefix }}
      BUNDLE_VAR_bucket: ${{ needs.read-state-backend.outputs.data_bucket }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: databricks bundle run maintain_delta_tables -- --drop-tables
        working-directory: databricks
        run: |
          databricks bundle run -t dev maintain_delta_tables -- \
            --catalog "${{ inputs.catalog }}" \
            --schema-prefix "${{ inputs.schema_prefix }}" \
            --drop-tables

  destroy-workspace-objects:
    name: 'Terraform: destroy workspace root'
    runs-on: ubuntu-latest
    needs: [read-state-backend, drop-owned-tables]
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform init (remote state)
        working-directory: databricks/terraform/workspace
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ needs.read-state-backend.outputs.state_bucket }}" \
            -backend-config="region=${{ inputs.aws-region }}" \
            -backend-config="dynamodb_table=${{ needs.read-state-backend.outputs.lock_table }}"

      - name: Terraform destroy
        working-directory: databricks/terraform/workspace
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          terraform destroy -input=false -auto-approve \
            -var="workspace_host=${{ secrets.DATABRICKS_HOST }}" \
            -var="catalog=${{ inputs.catalog }}" \
            -var="schema_prefix=${{ inputs.schema_prefix }}" \
            -var="bucket=${{ needs.read-state-backend.outputs.data_bucket }}" \
            -var="credential_name=${{ inputs.credential_name }}" \
            -var="trust_activation_confirmed=true"

  destroy-credential:
    name: 'Terraform: destroy credential root'
    runs-on: ubuntu-latest
    needs: [read-state-backend, destroy-workspace-objects]
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform init (remote state)
        working-directory: databricks/terraform/credential
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ needs.read-state-backend.outputs.state_bucket }}" \
            -backend-config="region=${{ inputs.aws-region }}" \
            -backend-config="dynamodb_table=${{ needs.read-state-backend.outputs.lock_table }}"

      - name: Terraform destroy
        working-directory: databricks/terraform/credential
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          terraform destroy -input=false -auto-approve \
            -var="workspace_host=${{ secrets.DATABRICKS_HOST }}" \
            -var="credential_name=${{ inputs.credential_name }}" \
            -var="storage_role_arn=${{ needs.read-state-backend.outputs.storage_role_arn }}"

  bundle-destroy:
    name: databricks bundle destroy (removes deployed jobs + wheel artifact)
    runs-on: ubuntu-latest
    needs: [read-state-backend, destroy-credential]
    environment: ${{ inputs.environment }}
    env:
      BUNDLE_VAR_catalog: ${{ inputs.catalog }}
      BUNDLE_VAR_schema_prefix: ${{ inputs.schema_prefix }}
      BUNDLE_VAR_bucket: ${{ needs.read-state-backend.outputs.data_bucket }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: databricks bundle destroy
        working-directory: databricks
        run: databricks bundle destroy -t dev --auto-approve

  teardown-hybrid-stacks:
    name: Teardown Hybrid Stacks (06, 05)
    runs-on: ubuntu-latest
    needs: bundle-destroy
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Refuse to delete stack 05 while stack 07 still imports its export
        run: |
          # Stack 05 exports both DatabricksStoragePolicyArn (imported by
          # stack 06, already destroyed above) AND SnowflakePublishPolicyArn
          # (imported by stack 07, the Snowflake storage role) - confirmed
          # live via `aws cloudformation list-exports`/stack 07's own
          # template. If stack 07 still exists, CloudFormation will refuse
          # to delete stack 05 with an opaque "export in use" error -
          # failing clearly here instead, before that confusing error, and
          # before 06 leaves a half-torn-down state.
          STACK="stock-market-pipeline-07-snowflake-storage-role-${{ inputs.environment }}"
          if aws cloudformation describe-stacks --stack-name "${STACK}" --region "${{ inputs.aws-region }}" >/dev/null 2>&1; then
            echo "ERROR: Stack ${STACK} still exists, and it imports stack 05's"
            echo "SnowflakePublishPolicyArn export. Deleting stack 05 now would fail."
            echo "Run 'Teardown Snowflake Platform' first (it destroys stack 07),"
            echo "then re-run this workflow."
            exit 1
          fi

      - name: Teardown stacks 06 and 05
        run: |
          chmod +x cloudformation/teardown-hybrid.sh
          echo "yes" | ./cloudformation/teardown-hybrid.sh "${{ inputs.environment }}"

      - name: Reminder about the state backend
        run: |
          echo "Stacks 05/06 destroyed. Stack 00 (Terraform state bucket + lock table)"
          echo "was NOT touched - it uses DeletionPolicy: Retain deliberately."
          echo "Delete it manually (empty + delete the S3 bucket, delete the DynamoDB"
          echo "table, then delete stack stock-market-pipeline-00-terraform-state-${{ inputs.environment }})"
          echo "only after confirming both Terraform roots destroyed cleanly above."
