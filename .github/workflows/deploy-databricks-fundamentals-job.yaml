name: Deploy Databricks Fundamentals Job

# R6: deploys and runs the landed_fundamentals wheel-task bundle
# (databricks/databricks.yml) against a small generated fixture - the same
# pattern deploy-databricks-job.yaml already proved for landed_ticks, now
# for the second job in the same bundle. Reads catalog/bucket values
# directly from the workspace Terraform root's remote state (no manual
# copying).
#
# Prerequisites: deploy-databricks-platform.yaml has already run
# successfully (including the broadened "landing" external location - see
# databricks/terraform/workspace/main.tf) in the same environment/region.
# Needs repo secrets DATABRICKS_HOST, DATABRICKS_TOKEN, AWS_DEPLOY_ROLE_ARN
# (all already used by the ticks job workflow).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      aws-region:
        description: 'AWS region (must match the platform deploy)'
        required: true
        default: 'us-east-2'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  read-platform-state:
    name: Read Bundle Variables From Terraform State
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      catalog: ${{ steps.vars.outputs.catalog }}
      schema_prefix: ${{ steps.vars.outputs.schema_prefix }}
      bucket: ${{ steps.vars.outputs.bucket }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Read Terraform state backend outputs (stack 00 must already exist)
        id: state
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "stock-market-pipeline-00-terraform-state-${{ inputs.environment }}" \
            --region "${{ inputs.aws-region }}" \
            --query "Stacks[0].Outputs[?OutputKey=='TerraformStateBucketName'].OutputValue" --output text)
          TABLE=$(aws cloudformation describe-stacks \
            --stack-name "stock-market-pipeline-00-terraform-state-${{ inputs.environment }}" \
            --region "${{ inputs.aws-region }}" \
            --query "Stacks[0].Outputs[?OutputKey=='TerraformLockTableName'].OutputValue" --output text)
          echo "bucket=${BUCKET}" >> "$GITHUB_OUTPUT"
          echo "table=${TABLE}" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform init (remote state, read-only)
        working-directory: databricks/terraform/workspace
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ steps.state.outputs.bucket }}" \
            -backend-config="region=${{ inputs.aws-region }}" \
            -backend-config="dynamodb_table=${{ steps.state.outputs.table }}"

      - name: Read bundle_variables output
        id: vars
        working-directory: databricks/terraform/workspace
        run: |
          terraform output -json bundle_variables > /tmp/bundle_vars.json
          echo "catalog=$(jq -r .catalog /tmp/bundle_vars.json)" >> "$GITHUB_OUTPUT"
          echo "schema_prefix=$(jq -r .schema_prefix /tmp/bundle_vars.json)" >> "$GITHUB_OUTPUT"
          echo "bucket=$(jq -r .bucket /tmp/bundle_vars.json)" >> "$GITHUB_OUTPUT"

  deploy-and-run:
    name: Bundle Validate, Deploy, Run
    runs-on: ubuntu-latest
    needs: read-platform-state
    environment: ${{ inputs.environment }}
    env:
      BUNDLE_VAR_catalog: ${{ needs.read-platform-state.outputs.catalog }}
      BUNDLE_VAR_schema_prefix: ${{ needs.read-platform-state.outputs.schema_prefix }}
      BUNDLE_VAR_bucket: ${{ needs.read-platform-state.outputs.bucket }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - uses: databricks/setup-cli@main

      - name: Generate and upload a small fixture fundamentals file
        run: |
          # Fixed extraction_id/retrieved_at/S3 key on every run, deliberately
          # - the same idempotent-fixture lesson learned for landed_ticks:
          # Auto Loader tracks already-seen files by path in its checkpoint,
          # so re-uploading the same path each run correctly finds nothing
          # new to ingest, exercising the no-op/replay skip instead of
          # accumulating a "changed" snapshot per workflow run.
          python3 - <<'PY'
          import gzip, json

          record = {
              "extraction_id": "ci-fixture-v1",
              "symbol": "AAPL",
              "retrieved_at": "2026-01-01T00:00:00+00:00",
              "market_cap": 2800000000000.0,
              "pe_ratio": 28.5,
              "forward_pe": 26.0,
              "dividend_yield": 0.005,
              "eps": 6.25,
              "beta": 1.2,
              "fifty_two_week_high": 199.6,
              "fifty_two_week_low": 143.9,
              "sector": "Technology",
              "industry": "Consumer Electronics",
          }
          with gzip.open("/tmp/ci-fixture-fundamentals.json.gz", "wt") as f:
              f.write(json.dumps(record) + "\n")
          PY
          aws s3 cp /tmp/ci-fixture-fundamentals.json.gz \
            "s3://${BUNDLE_VAR_bucket}/landing/fundamentals/ci-fixture/fixture-v1.json.gz" \
            --region "${{ inputs.aws-region }}"

      - name: databricks bundle validate
        working-directory: databricks
        run: databricks bundle validate -t dev

      - name: databricks bundle deploy
        working-directory: databricks
        run: databricks bundle deploy -t dev

      - name: databricks bundle run (landed_fundamentals)
        working-directory: databricks
        run: databricks bundle run -t dev landed_fundamentals

      - name: Verify the four owned Unity Catalog tables exist
        env:
          CATALOG: ${{ needs.read-platform-state.outputs.catalog }}
          PREFIX: ${{ needs.read-platform-state.outputs.schema_prefix }}
        run: |
          for table in \
            "${CATALOG}.${PREFIX}_bronze.fundamentals_raw" \
            "${CATALOG}.${PREFIX}_silver.fundamentals_quarantine" \
            "${CATALOG}.${PREFIX}_gold.fundamentals" \
            "${CATALOG}.${PREFIX}_gold.fundamentals_pipeline_state"; do
            echo ">>> Checking ${table}"
            databricks tables get "${table}" > /dev/null
          done
          echo "All four owned tables exist. Check fundamentals_pipeline_state's" \
               "'status' column in the Databricks UI/a notebook to confirm" \
               "'completed', and review the fundamentals/fundamentals_quarantine" \
               "row counts - this workflow only proves the tables exist, not" \
               "their row-level contents (no SQL warehouse is deployed for" \
               "this slice)."
